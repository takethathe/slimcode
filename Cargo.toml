[workspace]
resolver = "2"
members = ["crates/ai", "crates/agent", "crates/cli", "crates/commands"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
slimcode-ai = { path = "crates/ai" }
slimcode-agent = { path = "crates/agent" }
slimcode-commands = { path = "crates/commands" }
