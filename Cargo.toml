[workspace]
resolver = "2"
members = ["crates/ai", "crates/core", "crates/app", "crates/cli", "crates/commands", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
slimcode-ai = { path = "crates/ai" }
slimcode-core = { path = "crates/core" }
slimcode-app = { path = "crates/app" }
slimcode-commands = { path = "crates/commands" }
slimcode-tui = { path = "crates/tui" }
