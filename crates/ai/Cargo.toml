[package]
name = "slimcode-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
slimcode-agent = { path = "../agent" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "blocking",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test-only: the live smoke tests reference the shared config constants
# (env var names + defaults) from slimcode-common. slimcode-common itself
# depends on slimcode-ai, so this is a dev-dependency cycle: Cargo allows a
# dev-dependency to depend on the parent crate.
[dev-dependencies]
slimcode-common = { path = "../common" }
