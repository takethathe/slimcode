[package]
name = "slimcode-ai"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
slimcode-agent = { path = "../agent" }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "blocking",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
