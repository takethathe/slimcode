# slimcode-gui: the Tauri host behind the GUI frontend (ADR-0024).
#
# Deliberately NOT a member of the workspace at the repo root: Tauri drags in
# hundreds of dependencies, and the workspace gates (fmt / clippy / `cargo
# test`, the `architecture.rs` dependency matrix) must keep covering only the
# agent core. This crate has its own gates instead (D3). The empty `[workspace]`
# table opts it out of the parent workspace.
[package]
name = "slimcode-gui"
version = "0.1.0"
edition = "2024"
description = "The Tauri host of the slimcode GUI frontend (ADR-0024)"
license = "MIT"

# The GUI's own lockfile lives here; the workspace lockfile stays untouched.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
slimcode-app = { path = "../../crates/app" }
slimcode-sdk = { path = "../../crates/sdk" }

# Debug-only webview screenshot of the GUI frontend (docs/development.md).
# The code is compiled only into debug macOS builds (`cfg(all(debug_assertions,
# target_os = "macos"))` in lib.rs); the dependencies cannot be gated the same
# way, because Cargo refuses `debug_assertions` in `target.'cfg(..)'.
# dependencies`. Cost: a release macOS build compiles these bindings and
# dead-strips the module. Features are an explicit allowlist
# (default-features = false): these crates' defaults enable every generated
# AppKit / WebKit class. Versions are pinned to what wry already resolved, so
# nothing new enters the graph.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["alloc"] }
objc2-app-kit = {
    version = "0.3",
    default-features = false,
    features = [
        "std",
        "objc2-core-foundation",
        "NSBitmapImageRep",
        "NSImageRep",
        "NSGraphics",
        "NSImage",
    ],
}
objc2-foundation = {
    version = "0.3",
    default-features = false,
    features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSError"],
}
objc2-web-kit = {
    version = "0.3",
    default-features = false,
    features = [
        "std",
        "objc2-core-foundation",
        "objc2-app-kit",
        "block2",
        "WKWebView",
        "WKSnapshotConfiguration",
    ],
}

[dev-dependencies]
tempfile = "3"
